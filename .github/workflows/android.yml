name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to publish releases with the APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Version-bump policy guard: a release tag MUST match versionName ----
      - name: Verify tag matches versionName (version-bump policy)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | awk '{print $3}')
          echo "tag=$TAG versionName=$VER versionCode=$CODE"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match versionName $VER — every fix/upgrade must bump the version (see CHANGELOG.md)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrisNewGeneration-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- Release path: only for version tags ----
      - name: Generate ephemeral release keystore (no secrets configured)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/tng-release.keystore \
            -alias tng \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$TNG_LOCAL_PASS" -keypass "$TNG_LOCAL_PASS" \
            -dname "CN=Tetris New Generation, OU=CI, O=TNG"
          echo "TNG_KEYSTORE=/tmp/tng-release.keystore" >> $GITHUB_ENV
          echo "TNG_KEYSTORE_PASSWORD=$TNG_LOCAL_PASS" >> $GITHUB_ENV
          echo "TNG_KEY_ALIAS=tng" >> $GITHUB_ENV
          echo "TNG_KEY_PASSWORD=$TNG_LOCAL_PASS" >> $GITHUB_ENV
        env:
          TNG_LOCAL_PASS: ${{ secrets.TNG_SIGNING_PASS || 'tng-ci-ephemeral-key' }}

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Tetris New Generation ${{ github.ref_name }}
          body: |
            Tetris New Generation | تيتريس الجيل الجديد

            - Installable offline APK (Android 7.0+)
            - Built by GitHub Actions from tag ${{ github.ref_name }}
            - If no signing secrets were configured, the APK is signed with a CI-generated key

            حمّل الملف أدناه وثبّته على هاتفك؛ اللعبة تعمل دون إنترنت بالكامل.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
